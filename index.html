<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل بيانات الرحلة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <form class="card" id="trip-form" novalidate>

      <header class="card-header">
        <h1>تسجيل بيانات الرحلة</h1>
        <p>أدخل بيانات الراكب والرحلة لإتمام التسجيل</p>
      </header>

      <section class="section">
        <h2 class="section-title">بيانات الراكب</h2>

        <div class="field">
          <label for="full-name">الاسم</label>
          <input type="text" id="full-name" name="fullName" placeholder="الاسم بالكامل" autocomplete="name">
          <span class="error-msg" id="err-fullName"></span>
        </div>

        <div class="field">
          <label for="phone">رقم التليفون</label>
          <input type="tel" id="phone" name="phone" placeholder="01xxxxxxxxx" autocomplete="tel" inputmode="numeric" maxlength="11">
          <span class="error-msg" id="err-phone"></span>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">بيانات الرحلة</h2>

        <div class="field">
          <label for="trip-date">تاريخ الرحلة</label>
          <input type="date" id="trip-date" name="tripDate">
          <span class="error-msg" id="err-tripDate"></span>
        </div>

        <div id="legs-container"></div>

        <button type="button" class="add-leg-btn" id="add-leg-btn">+ إضافة مواصلة</button>

        <div class="legs-total" id="legs-total" hidden></div>

        <div class="field">
          <label for="notes">ملاحظات</label>
          <textarea id="notes" name="notes" placeholder="أي تفاصيل إضافية عن الرحلة (اختياري)" rows="3"></textarea>
        </div>
      </section>

      <div class="form-summary" id="form-summary" role="alert" hidden></div>
      <p>By Mahmoud Eid</p>
      <button type="submit" class="submit-btn">تسجيل بيانات الرحلة</button>

    </form>
  </main>

  <div class="modal-overlay" id="success-modal" hidden>
    <div class="modal-box">
      <div class="modal-icon">✓</div>
      <h3 class="modal-title">تم تسجيل الرحلة بنجاح</h3>
      <p class="modal-text">تم حفظ بيانات رحلتك بكل مواصلاتها بنجاح.</p>
      <button type="button" class="modal-btn" id="modal-ok-btn">تم</button>
    </div>
  </div>

<script>

  const SUPABASE_URL = 'https://sdbvevefxziyhzqzilrv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNkYnZldmVmeHppeWh6cXppbHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzMjk0NjUsImV4cCI6MjEwNDkwNTQ2NX0.ugU0hZIdZmXYQXxdxGBSXJ8qy-EKBJ2pckemh8Yx7zg'

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById('trip-form');
  const summary = document.getElementById('form-summary');
  const legsContainer = document.getElementById('legs-container');
  const addLegBtn = document.getElementById('add-leg-btn');
  const legsTotalEl = document.getElementById('legs-total');
  const successModal = document.getElementById('success-modal');
  const modalOkBtn = document.getElementById('modal-ok-btn');

  document.getElementById('trip-date').valueAsDate = new Date();

  const TRANSPORT_OPTIONS = [
    { value: 'microbus', label: 'ميكروباص' },
    { value: 'taxi', label: 'تاكسي' },
    { value: 'bus', label: 'أتوبيس' },
    { value: 'metro', label: 'مترو' },
    { value: 'other', label: 'أخرى' }
  ];

  let legCounter = 0;

  function buildLegCard(id) {
    const card = document.createElement('div');
    card.className = 'leg-card';
    card.dataset.legId = id;

    const optionsHtml = TRANSPORT_OPTIONS
      .map(o => `<option value="${o.value}"${o.value === 'microbus' ? ' selected' : ''}>${o.label}</option>`)
      .join('');

    card.innerHTML = `
      <div class="leg-card-header">
        <span class="leg-number"></span>
        <button type="button" class="remove-leg-btn" aria-label="حذف المواصلة">✕</button>
      </div>
      <div class="field-row">
        <div class="field">
          <label>من</label>
          <input type="text" class="leg-from" placeholder="نقطة البداية" autocomplete="off">
          <span class="error-msg leg-err-from"></span>
        </div>
        <div class="field">
          <label>إلى</label>
          <input type="text" class="leg-to" placeholder="نقطة النهاية" autocomplete="off">
          <span class="error-msg leg-err-to"></span>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>نوع المواصلة</label>
          <div class="select-wrap">
            <select class="leg-transport">${optionsHtml}</select>
          </div>
        </div>
        <div class="field">
          <label>التكلفة (جنيه)</label>
          <input type="number" class="leg-cost" placeholder="75.00" step="0.01" min="0" inputmode="decimal">
          <span class="error-msg leg-err-cost"></span>
        </div>
      </div>
    `;

    card.querySelector('.remove-leg-btn').addEventListener('click', () => removeLeg(card));

    const fieldMap = [
      ['.leg-from', '.leg-err-from'],
      ['.leg-to', '.leg-err-to'],
      ['.leg-cost', '.leg-err-cost']
    ];

    fieldMap.forEach(([inputSel, errSel]) => {
      const el = card.querySelector(inputSel);
      const err = card.querySelector(errSel);
      el.addEventListener('input', () => {
        el.classList.remove('invalid');
        if (err) err.textContent = '';
        updateTotal();
      });
    });

    card.querySelector('.leg-transport').addEventListener('input', () => {
      card.querySelector('.leg-transport').classList.remove('invalid');
    });

    return card;
  }

  function addLeg() {
    legCounter += 1;
    const card = buildLegCard(legCounter);
    legsContainer.appendChild(card);
    renumberLegs();
  }

  function removeLeg(card) {
    if (legsContainer.children.length <= 1) return;
    card.remove();
    renumberLegs();
    updateTotal();
  }

  function renumberLegs() {
    const cards = legsContainer.querySelectorAll('.leg-card');
    cards.forEach((card, i) => {
      card.querySelector('.leg-number').textContent = `مواصلة ${i + 1}`;
      card.querySelector('.remove-leg-btn').hidden = cards.length <= 1;
    });
  }

  function updateTotal() {
    const costs = Array.from(legsContainer.querySelectorAll('.leg-cost'))
      .map(el => parseFloat(el.value))
      .filter(v => !isNaN(v));

    if (costs.length === 0) {
      legsTotalEl.hidden = true;
      legsTotalEl.textContent = '';
      return;
    }

    const total = costs.reduce((sum, v) => sum + v, 0);
    legsTotalEl.hidden = false;
    legsTotalEl.textContent = `الإجمالي: ${total.toFixed(2)} جنيه`;
  }

  addLegBtn.addEventListener('click', addLeg);

  // start with a single leg
  addLeg();

  function readLegs() {
    return Array.from(legsContainer.querySelectorAll('.leg-card')).map(card => ({
      card,
      from: card.querySelector('.leg-from').value.trim(),
      to: card.querySelector('.leg-to').value.trim(),
      transport: card.querySelector('.leg-transport').value,
      cost: parseFloat(card.querySelector('.leg-cost').value)
    }));
  }

  function validateForm(data, legs) {
    const errors = [];

    if (!data.fullName || data.fullName.length < 3)
      errors.push({ field: "fullName", message: "الاسم قصير جداً" });

    if (!/^01[0-2,5]\d{8}$/.test(data.phone))
      errors.push({ field: "phone", message: "رقم التليفون غير صحيح" });

    if (!data.tripDate)
      errors.push({ field: "tripDate", message: "اختر تاريخ الرحلة" });

    legs.forEach((leg, i) => {
      if (!leg.from || leg.from.length < 2)
        errors.push({ leg: i, field: "from", message: "اكتب نقطة البداية" });

      if (!leg.to || leg.to.length < 2)
        errors.push({ leg: i, field: "to", message: "اكتب نقطة النهاية" });

      if (!leg.cost || leg.cost <= 0 || leg.cost > 10000)
        errors.push({ leg: i, field: "cost", message: "التكلفة غير منطقية" });
    });

    return errors;
  }

  function clearErrors() {
    form.querySelectorAll('.error-msg').forEach(el => el.textContent = '');
    form.querySelectorAll('.invalid').forEach(el => el.classList.remove('invalid'));
    summary.hidden = true;
    summary.textContent = '';
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearErrors();

    const raw = Object.fromEntries(new FormData(form).entries());
    const legs = readLegs();

    const validationData = {
      fullName: raw.fullName?.trim() || '',
      phone: raw.phone?.trim() || '',
      tripDate: raw.tripDate
    };

    const errors = validateForm(validationData, legs);

    if (errors.length) {
      let firstInvalid = null;

      errors.forEach(({ field, message, leg }) => {
        if (leg === undefined) {
          const errEl = document.getElementById('err-' + field);
          const inputEl = form.elements[field];
          if (errEl) errEl.textContent = message;
          if (inputEl) { inputEl.classList.add('invalid'); firstInvalid = firstInvalid || inputEl; }
        } else {
          const card = legs[leg].card;
          const errEl = card.querySelector('.leg-err-' + field);
          const inputEl = card.querySelector('.leg-' + field);
          if (errEl) errEl.textContent = message;
          if (inputEl) { inputEl.classList.add('invalid'); firstInvalid = firstInvalid || inputEl; }
        }
      });

      summary.hidden = false;
      summary.textContent = `يوجد ${errors.length} ${errors.length === 1 ? 'خطأ' : 'أخطاء'} يجب تصحيحها قبل الإرسال`;
      firstInvalid?.focus();
      return;
    }

    const totalCost = legs.reduce((sum, leg) => sum + leg.cost, 0);

    const dbData = {
      full_name: validationData.fullName,
      phone: validationData.phone,
      trip_date: validationData.tripDate,
      legs: legs.map(leg => ({
        from: leg.from,
        to: leg.to,
        transport: leg.transport,
        cost: leg.cost
      })),
      total_cost: totalCost,
      notes: raw.notes?.trim() || null
    };

    const btn = form.querySelector('.submit-btn');
    const original = btn.textContent;
    btn.textContent = 'جاري التسجيل...';
    btn.disabled = true;

    const { error } = await supabaseClient.from('trips').insert(dbData);

    if (error) {
      console.error('Supabase error:', error);
      summary.hidden = false;
      summary.textContent = 'حدث خطأ أثناء الحفظ: ' + error.message;
      btn.textContent = original;
      btn.disabled = false;
      return;
    }

    btn.textContent = original;
    btn.disabled = false;
    successModal.hidden = false;
  });

  modalOkBtn.addEventListener('click', () => {
    successModal.hidden = true;

    form.reset();
    document.getElementById('trip-date').valueAsDate = new Date();

    legsContainer.innerHTML = '';
    legCounter = 0;
    addLeg();
    updateTotal();
    clearErrors();
  });

  form.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', () => {
      el.classList.remove('invalid');
      const errEl = document.getElementById('err-' + el.name);
      if (errEl) errEl.textContent = '';
    });
  });
</script>
</body>
</html>
